<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0a0705">
    <title>Dutch · prototype PixiJS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Playfair+Display:ital,wght@0,700;0,900;1,900&display=swap" rel="stylesheet">
    <!-- PixiJS (WebGL rendering) and GSAP (animations), pinned versions -->
    <script type="importmap">
        {
            "imports": {
                "pixi.js": "https://cdn.jsdelivr.net/npm/pixi.js@8.22.0/dist/pixi.min.mjs",
                "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.15.0/+esm"
            }
        }
    </script>
    <style>
        html, body {
            margin: 0;
            height: 100%;
            background: #0a0705;
            overflow: hidden;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-family: Outfit, system-ui, sans-serif;
        }

        canvas { display: block; }

        header {
            position: fixed;
            inset: 0 0 auto 0;
            height: 40px;
            padding: env(safe-area-inset-top) max(10px, env(safe-area-inset-right)) 0 max(10px, env(safe-area-inset-left));
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 2;
            pointer-events: none;
        }

        header a, header button {
            pointer-events: auto;
            min-height: 32px;
            padding: 0 14px;
            display: inline-flex;
            align-items: center;
            border-radius: 999px;
            border: 1px solid rgba(255, 236, 190, .25);
            background: rgba(10, 7, 5, .55);
            color: #f6ead0;
            font: 600 13px Outfit, system-ui, sans-serif;
            text-decoration: none;
            cursor: pointer;
        }

        header a:focus-visible, header button:focus-visible { outline: 2px solid #ffd166; outline-offset: 2px; }

        #loading {
            position: fixed;
            inset: 0;
            display: grid;
            place-items: center;
            color: #f6ead0;
            font: 600 16px Outfit, system-ui, sans-serif;
        }
    </style>
</head>
<body>
<header>
    <a href="../">← Jeu actuel</a>
    <button id="sound" type="button" aria-pressed="true">Son : oui</button>
</header>
<div id="loading">Mise en place de la table…</div>
<script type="module" src="../src/ts/proto/main.js"></script>
</body>
</html>
