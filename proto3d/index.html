<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0a0705">
    <title>Dutch · prototype 3D</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Playfair+Display:ital,wght@0,700;0,900;1,900&display=swap" rel="stylesheet">
    <!-- Three.js (3D) and GSAP (animations), pinned versions -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.min.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/",
                "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.15.0/+esm"
            }
        }
    </script>
    <style>
        :root {
            --gold: #ffd166;
            --cream: #f6ead0;
            --ink: #12100d;
            --danger: #c8323c;
        }

        html, body {
            margin: 0;
            height: 100%;
            background: #0a0705;
            overflow: hidden;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-family: Outfit, system-ui, sans-serif;
            color: var(--cream);
        }

        canvas { display: block; }

        #labels { position: fixed; inset: 0; pointer-events: none; }

        header {
            position: fixed;
            inset: 0 0 auto 0;
            height: 44px;
            padding: env(safe-area-inset-top) max(10px, env(safe-area-inset-right)) 0 max(10px, env(safe-area-inset-left));
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            pointer-events: none;
            z-index: 3;
        }

        header a, header button, .pill {
            pointer-events: auto;
            min-height: 34px;
            padding: 0 14px;
            display: inline-flex;
            align-items: center;
            border-radius: 999px;
            border: 1px solid rgba(255, 236, 190, .25);
            background: rgba(10, 7, 5, .6);
            color: var(--cream);
            font: 600 13px Outfit, system-ui, sans-serif;
            text-decoration: none;
            cursor: pointer;
        }

        #banner {
            position: fixed;
            top: calc(52px + env(safe-area-inset-top));
            left: 50%;
            transform: translateX(-50%);
            max-width: calc(100vw - 24px);
            padding: 8px 18px;
            border-radius: 999px;
            background: rgba(10, 7, 5, .62);
            border: 1px solid rgba(255, 236, 190, .2);
            font: 600 15px Outfit, system-ui, sans-serif;
            text-align: center;
            pointer-events: none;
            z-index: 2;
            transition: opacity 200ms ease-out;
        }

        #actions {
            position: fixed;
            left: 50%;
            bottom: calc(14px + env(safe-area-inset-bottom));
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 2;
        }

        #actions button {
            min-height: 46px;
            padding: 0 22px;
            border-radius: 999px;
            font: 800 15px Outfit, system-ui, sans-serif;
            cursor: pointer;
            border: 1px solid #ffe7a3;
            background: linear-gradient(180deg, #ffe08a, #f2c14e 55%, #d9a531);
            color: #2a1805;
            box-shadow: 0 2px 0 #8a6416, 0 8px 18px rgba(0, 0, 0, .45);
            animation: pop 260ms cubic-bezier(.2, .9, .3, 1.3) both;
            transition: transform 120ms ease-out;
        }

        #actions button.danger { background: linear-gradient(180deg, #e35a62, #c8323c); color: #fff; border-color: #ff9a9a; box-shadow: 0 2px 0 #6e1218, 0 8px 18px rgba(0, 0, 0, .45); }
        #actions button.ghost { background: rgba(10, 7, 5, .7); color: var(--cream); border-color: rgba(255, 255, 255, .45); box-shadow: none; }
        #actions button:active { transform: scale(.96); }
        #actions button:focus-visible, header a:focus-visible, header button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

        @keyframes pop { from { opacity: 0; transform: translateY(10px) scale(.9); } }

        /* Labels in the 3D scene (names next to the tokens, messages) */
        .seat-label {
            padding: 3px 10px;
            border-radius: 10px;
            background: rgba(10, 7, 5, .7);
            border: 1px solid rgba(255, 236, 190, .2);
            font: 800 13px Outfit, system-ui, sans-serif;
            text-align: center;
            white-space: nowrap;
            transition: border-color 200ms, box-shadow 200ms;
        }

        .seat-label small { display: block; font-weight: 400; font-size: 11px; opacity: .8; }
        .seat-label.active { border-color: var(--gold); box-shadow: 0 0 0 2px rgba(255, 209, 102, .35), 0 0 18px rgba(255, 209, 102, .35); }
        .seat-label .badge { display: inline-block; margin-left: 6px; padding: 0 6px; border-radius: 6px; background: var(--gold); color: #2a1805; font-size: 10px; vertical-align: 1px; }

        .bubble {
            max-width: 220px;
            padding: 6px 12px;
            border-radius: 12px;
            background: rgba(13, 15, 20, .92);
            border: 2px solid var(--c, var(--gold));
            font: 600 12.5px Outfit, system-ui, sans-serif;
            text-align: center;
            white-space: normal;
            animation: pop 240ms cubic-bezier(.2, .9, .3, 1.3) both;
        }

        .deck-count { font: 600 12px Outfit, system-ui, sans-serif; opacity: .85; }

        #panel {
            position: fixed;
            inset: 0;
            display: grid;
            place-items: center;
            background: rgba(0, 0, 0, .45);
            z-index: 4;
            animation: fade 200ms ease-out both;
        }

        #panel[hidden] { display: none; }

        #panel section {
            width: min(400px, calc(100vw - 32px));
            padding: 18px 20px;
            border-radius: 18px;
            background: rgba(18, 16, 13, .96);
            border: 2px solid rgba(255, 209, 102, .5);
            animation: pop 300ms cubic-bezier(.2, .9, .3, 1.3) both;
        }

        #panel h2 { margin: 0 0 12px; text-align: center; font: 900 24px "Playfair Display", Georgia, serif; color: var(--gold); }
        #panel ol { list-style: none; margin: 0 0 16px; padding: 0; }
        #panel li { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid rgba(255, 236, 190, .1); }
        #panel li .dot { width: 14px; height: 14px; border-radius: 50%; }
        #panel li .who { flex: 1; font-weight: 800; }
        #panel li .pts { opacity: .8; }
        #panel li .total { width: 40px; text-align: right; font-weight: 800; }
        #panel li.win .who { color: var(--gold); }
        #panel button { width: 100%; }

        @keyframes fade { from { opacity: 0; } }

        #loading { position: fixed; inset: 0; display: grid; place-items: center; font: 600 16px Outfit, system-ui, sans-serif; }

        @media (prefers-reduced-motion: reduce) {
            #actions button, .bubble, #panel, #panel section { animation: none; }
        }
    </style>
</head>
<body>
<header>
    <a href="../">← Jeu actuel</a>
    <span class="pill" id="info" aria-live="off">Prototype 3D</span>
    <button id="sound" type="button" aria-pressed="true">Son : oui</button>
</header>
<div id="banner" role="status" aria-live="polite"></div>
<div id="actions" role="group" aria-label="Actions"></div>
<div id="panel" hidden></div>
<div id="labels"></div>
<div id="loading">Mise en place de la table…</div>
<script type="module" src="../src/ts/proto3d/main.js"></script>
</body>
</html>
