# Publish the site on GitHub Pages:
# - main (the real game) at https://vodianoi.github.io/Dutch/
# - dev (the test version) at https://vodianoi.github.io/Dutch/dev/
# - style/new-look (preview of the new look) at https://vodianoi.github.io/Dutch/new-look/
# main and dev are published together on every push to either of them.
# The preview is published from dev: only main and dev may deploy to GitHub Pages, so a push to
# style/new-look publishes nothing by itself. To refresh the preview, run this workflow by hand
# from dev (Actions > Pages > Run workflow), or push to dev.
# A push to main publishes the site without /new-look/ as long as main does not have this step.
name: Pages

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, never cancel one in progress
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Real game (main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: _site

      - name: Test version (dev) under /dev/
        run: |
          if git ls-remote --exit-code --heads "https://github.com/${{ github.repository }}" dev > /dev/null; then
            git clone --depth 1 --branch dev "https://github.com/${{ github.repository }}" _site/dev
          else
            echo "No dev branch: only main is published"
          fi

      - name: Preview of the new look (style/new-look) under /new-look/
        run: |
          if git ls-remote --exit-code --heads "https://github.com/${{ github.repository }}" style/new-look > /dev/null; then
            git clone --depth 1 --branch style/new-look "https://github.com/${{ github.repository }}" _site/new-look
          else
            echo "No style/new-look branch: no preview"
          fi

      - name: Remove what is not part of the site
        # The prototypes (proto/, proto3d/) stay on the test version only
        run: rm -rf _site/.git _site/.github _site/proto _site/proto3d _site/dev/.git _site/dev/.github _site/new-look/.git _site/new-look/.github _site/new-look/proto _site/new-look/proto3d

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
